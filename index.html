<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Car Personality Reader</title><meta name="theme-color" content="#1b1240">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><div class="stars">✦ ✧ ✦</div><h1>Car Personality Reader</h1><p class="sub">Snap a car. Discover its soul.</p></header>

<section id="s-photo" class="card">
 <label class="drop" id="drop"><input id="file" type="file" accept="image/*" capture="environment" hidden>
  <img id="preview" alt="" hidden><span id="dropTxt">📸<br><b>Tap to take a photo</b><br><small>or choose one from your library</small></span></label>
 <button id="btnRead" class="primary" disabled>🔮 Read its personality</button>
</section>

<section id="s-pick" class="card" hidden>
 <h2>Help the stars a little</h2><p class="hint" id="pickHint">Tell us about this beauty:</p>
 <label>Make<select id="make"></select></label>
 <div class="chips" id="types"></div>
 <button id="btnPick" class="primary">✨ Reveal the horoscope</button>
</section>

<section id="s-load" class="card center" hidden>
 <div class="orb"></div><p id="loadTxt">Analyzing your car's aura…</p>
</section>

<section id="s-result" hidden>
 <canvas id="cv" width="1080" height="1620"></canvas>
 <div class="row"><button id="btnShare" class="primary">📤 Share</button><button id="btnSave">⬇️ Save</button></div>
 <button id="btnAgain" class="ghost">↺ Read another car</button>
</section>
<footer>Made with AI for fun · just for laughs, not a vehicle appraisal</footer>
</main><script src="app.js"></script></body></html>
